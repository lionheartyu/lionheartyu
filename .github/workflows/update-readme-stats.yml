name: Update README stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats SVGs
        env:
          GH_TOKEN: ${{ github.token }}
          USERNAME: lionheartyu
        run: |
          set -euo pipefail

          mkdir -p assets

          user_json=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/users/$USERNAME")

          repos_json=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/users/$USERNAME/repos?per_page=100&type=owner&sort=updated")

          total_prs=$(curl -fsSL -G \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            --data-urlencode "q=is:pr author:$USERNAME" \
            https://api.github.com/search/issues | jq -r '.total_count')

          merged_prs=$(curl -fsSL -G \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            --data-urlencode "q=is:pr is:merged author:$USERNAME" \
            https://api.github.com/search/issues | jq -r '.total_count')

          systemd_prs=$(curl -fsSL -G \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            --data-urlencode "q=repo:systemd/systemd is:pr is:merged author:$USERNAME" \
            https://api.github.com/search/issues | jq -r '.total_count')

          systemd_commits=$(curl -fsSL -G \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            --data-urlencode "q=repo:systemd/systemd author:$USERNAME" \
            https://api.github.com/search/commits | jq -r '.total_count')

          total_commits=$(curl -fsSL -G \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            --data-urlencode "q=author:$USERNAME" \
            https://api.github.com/search/commits | jq -r '.total_count')

          merged_rate="0"
          if [ "$total_prs" -gt 0 ]; then
            merged_rate=$(awk "BEGIN { printf \"%.2f\", $merged_prs * 100 / $total_prs }")
          fi

          cat > assets/github-stats.svg <<EOF
          <svg width="420" height="230" viewBox="0 0 420 230" xmlns="http://www.w3.org/2000/svg">
            <rect width="420" height="230" rx="8" fill="#0D1117"/>
            <text x="34" y="48" fill="#58A6FF" font-size="24" font-family="Segoe UI, Arial" font-weight="700">PRs &amp; Commits</text>
            <text x="34" y="92" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="600">Total Commits:</text>
            <text x="360" y="92" text-anchor="end" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="700">$total_commits</text>
            <text x="34" y="130" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="600">Total PRs:</text>
            <text x="360" y="130" text-anchor="end" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="700">$total_prs</text>
            <text x="34" y="168" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="600">Total PRs Merged:</text>
            <text x="360" y="168" text-anchor="end" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="700">$merged_prs</text>
            <text x="34" y="206" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="600">Merged PRs Percentage:</text>
            <text x="360" y="206" text-anchor="end" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="700">$merged_rate%</text>
          </svg>
          EOF

          cat > assets/systemd-stats.svg <<EOF
          <svg width="860" height="125" viewBox="0 0 860 125" xmlns="http://www.w3.org/2000/svg">
            <rect width="860" height="125" rx="8" fill="#0D1117"/>
            <text x="430" y="42" text-anchor="middle" fill="#58A6FF" font-size="26" font-family="Segoe UI, Arial" font-weight="700">systemd Contributions</text>
            <text x="430" y="82" text-anchor="middle" fill="#C9D1D9" font-size="20" font-family="Segoe UI, Arial" font-weight="600">Merged PRs: $systemd_prs  |  Commits: $systemd_commits</text>
          </svg>
          EOF

          cat > assets/top-langs.svg <<EOF
          <svg width="420" height="230" viewBox="0 0 420 230" xmlns="http://www.w3.org/2000/svg">
            <rect width="420" height="230" rx="8" fill="#0D1117"/>
            <text x="34" y="48" fill="#58A6FF" font-size="24" font-family="Segoe UI, Arial" font-weight="700">Top Languages</text>
            <text x="34" y="105" fill="#C9D1D9" font-size="16" font-family="Segoe UI, Arial">Use GitHub language card below if you want exact language percentages.</text>
            <text x="34" y="140" fill="#8B949E" font-size="14" font-family="Segoe UI, Arial">This custom Action keeps PR and commit stats fresh.</text>
          </svg>
          EOF

      - name: Generate stats SVGs
        env:
          GH_TOKEN: ${{ github.token }}
          USERNAME: lionheartyu
        run: |
          set -euo pipefail

          mkdir -p assets

          api() {
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$@"
          }

          search_issues() {
            curl -fsSL -G \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              --data-urlencode "q=$1" \
              https://api.github.com/search/issues | jq -r '.total_count'
          }

          search_commits() {
            curl -fsSL -G \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              --data-urlencode "q=$1" \
              https://api.github.com/search/commits | jq -r '.total_count'
          }

          total_prs=$(search_issues "is:pr author:$USERNAME")
          merged_prs=$(search_issues "is:pr is:merged author:$USERNAME")
          total_commits=$(search_commits "author:$USERNAME")
          systemd_prs=$(search_issues "repo:systemd/systemd is:pr is:merged author:$USERNAME")
          systemd_commits=$(search_commits "repo:systemd/systemd author:$USERNAME")

          merged_rate="0.00"
          if [ "$total_prs" -gt 0 ]; then
            merged_rate=$(awk "BEGIN { printf \"%.2f\", $merged_prs * 100 / $total_prs }")
          fi

          repos=$(api "https://api.github.com/users/$USERNAME/repos?per_page=100&type=owner&sort=updated")
          tmp_langs=$(mktemp)

          echo '{}' > "$tmp_langs"

          echo "$repos" | jq -r '.[].languages_url' | while read -r url; do
            langs=$(api "$url")
            jq -s '.[0] * (.[1] | with_entries(.value |= tonumber))' "$tmp_langs" <(echo "$langs") > "$tmp_langs.next"
            mv "$tmp_langs.next" "$tmp_langs"
          done

          total_lang_bytes=$(jq '[.[]] | add // 0' "$tmp_langs")

          lang_rows=$(jq -r --argjson total "$total_lang_bytes" '
            to_entries
            | sort_by(.value)
            | reverse
            | .[:8]
            | .[]
            | "\(.key)|\(.value)|\((.value * 100 / $total))"
          ' "$tmp_langs")

          color_for_lang() {
            case "$1" in
              "C++") echo "#f34b7d" ;;
              "C") echo "#555555" ;;
              "Rust") echo "#dea584" ;;
              "Makefile") echo "#427819" ;;
              "CMake") echo "#DA3434" ;;
              "Shell") echo "#89e051" ;;
              "HTML") echo "#e34c26" ;;
              "Java") echo "#b07219" ;;
              "Python") echo "#3572A5" ;;
              "Meson") echo "#007800" ;;
              *) echo "#8B949E" ;;
            esac
          }

          cat > assets/github-stats.svg <<EOF
          <svg width="420" height="230" viewBox="0 0 420 230" xmlns="http://www.w3.org/2000/svg">
            <rect width="420" height="230" rx="8" fill="#0D1117"/>
            <text x="34" y="48" fill="#58A6FF" font-size="24" font-family="Segoe UI, Arial" font-weight="700">PRs &amp; Commits</text>
            <text x="34" y="92" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="600">Total Commits:</text>
            <text x="360" y="92" text-anchor="end" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="700">$total_commits</text>
            <text x="34" y="130" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="600">Total PRs:</text>
            <text x="360" y="130" text-anchor="end" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="700">$total_prs</text>
            <text x="34" y="168" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="600">Total PRs Merged:</text>
            <text x="360" y="168" text-anchor="end" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="700">$merged_prs</text>
            <text x="34" y="206" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="600">Merged PRs Percentage:</text>
            <text x="360" y="206" text-anchor="end" fill="#C9D1D9" font-size="18" font-family="Segoe UI, Arial" font-weight="700">$merged_rate%</text>
          </svg>
          EOF

          {
            echo '<svg width="420" height="230" viewBox="0 0 420 230" xmlns="http://www.w3.org/2000/svg">'
            echo '<rect width="420" height="230" rx="8" fill="#0D1117"/>'
            echo '<text x="34" y="48" fill="#58A6FF" font-size="24" font-family="Segoe UI, Arial" font-weight="700">Top Languages</text>'

            x=34
            y=72
            echo '<rect x="34" y="72" width="352" height="10" rx="5" fill="#30363D"/>'

            echo "$lang_rows" | while IFS='|' read -r name bytes percent; do
              width=$(awk "BEGIN { printf \"%d\", 352 * $percent / 100 }")
              color=$(color_for_lang "$name")
              echo "<rect x=\"$x\" y=\"72\" width=\"$width\" height=\"10\" rx=\"5\" fill=\"$color\"/>"
              x=$((x + width))
            done

            i=0
            echo "$lang_rows" | while IFS='|' read -r name bytes percent; do
              color=$(color_for_lang "$name")
              col=$((i % 2))
              row=$((i / 2))
              if [ "$col" -eq 0 ]; then
                tx=34
              else
                tx=220
              fi
              ty=$((118 + row * 31))
              pct=$(awk "BEGIN { printf \"%.2f\", $percent }")
              echo "<circle cx=\"$tx\" cy=\"$ty\" r=\"6\" fill=\"$color\"/>"
              echo "<text x=\"$((tx + 16))\" y=\"$((ty + 5))\" fill=\"#C9D1D9\" font-size=\"13\" font-family=\"Segoe UI, Arial\">$name $pct%</text>"
              i=$((i + 1))
            done

            echo '</svg>'
          } > assets/top-langs.svg

          cat > assets/systemd-stats.svg <<EOF
          <svg width="860" height="125" viewBox="0 0 860 125" xmlns="http://www.w3.org/2000/svg">
            <rect width="860" height="125" rx="8" fill="#0D1117"/>
            <text x="430" y="42" text-anchor="middle" fill="#58A6FF" font-size="26" font-family="Segoe UI, Arial" font-weight="700">systemd Contributions</text>
            <text x="430" y="82" text-anchor="middle" fill="#C9D1D9" font-size="20" font-family="Segoe UI, Arial" font-weight="600">Merged PRs: $systemd_prs | Commits: $systemd_commits</text>
          </svg>
          EOF
